[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchprio"
version = "0.1.0"
description = "Рекомендательная система приоритизации патч-менеджмента (ВКР, МИРЭА)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "All9wer" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
patchprio = "patchprio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
