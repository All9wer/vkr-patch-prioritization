# Конфигурация ретроспективного эксперимента.
# Методика описана в docs/methodology.md.

[data]
# Каталог для скачанных данных (не попадает в git)
raw_dir = "data/raw"

[experiment]
# Даты срезов. На каждую дату система "видит" только то,
# что было известно на этот момент.
snapshots = ["2022-01-01", "2022-07-01", "2023-01-01", "2023-07-01"]

# Совокупность: CVE, опубликованные за window_days до среза
window_days = 365

# Разметка: уязвимость считается эксплуатируемой, если попала
# в каталог CISA KEV в течение horizon_days после среза
horizon_days = 365

# Бюджет устранения как доля от числа уязвимостей в срезе
budgets = [0.01, 0.05, 0.10, 0.20]

# Целевые уровни покрытия: сколько уязвимостей нужно закрыть,
# чтобы закрыть указанную долю реально эксплуатируемых
coverage_targets = [0.5, 0.8]

# Пороговые политики "закрываем всё, что выше порога CVSS"
cvss_policies = [7.0, 9.0]

results_dir = "experiments/results"

[fstec]
# Таблица сопоставления типа слабости CWE и типа последствия
# по методике ФСТЭК (показатель H)
cwe_consequences = "config/fstec_cwe_consequences.csv"

# Типовой профиль инфраструктуры для уровней критичности по методике.
# На порядок в очереди не влияет, только на то, какие уязвимости
# попадут в "критический", "высокий" и т.д.
# component: critical_process, firewall, network, telecom, server,
#            workstation, storage, other
# share: ">70", "50-70", "10-50", "<10" (доля уязвимых узлов)
infra_component = "server"
infra_share = "10-50"
infra_internet = true

[llm]
# Провайдер языковой модели. Пока "none": интеллектуальный слой
# заложен архитектурно (src/patchprio/llm), но не подключён.
provider = "none"
